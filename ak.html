<html lang="id">

</head>
<body>

    <main class="container">
        <div class="header-section">
            <h1>Acara <span>Komunitas</span></h1>
            <p>Ikuti keseruan kegiatan outdoor</p>
        </div>

        <div class="search-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass" style="color:#94a3b8;"></i>
                <input type="text" id="inputCari" placeholder="Cari event seru..." oninput="filterSistemEvent()">
            </div>
            <div class="divider"></div>
            <div class="filter-box" style="display: flex; align-items: center; gap: 10px;">
                <i class="fa-solid fa-filter" style="color:#94a3b8;"></i>
                <select class="filter-select" id="selectFilterProvinsi" onchange="filterSistemEvent()">
                    <option value="Semua">Semua Lokasi</option>
                    <option value="Jawa Barat">Jawa Barat</option>
                    <option value="Jawa Tengah">Jawa Tengah</option>
                    <option value="Jawa Timur">Jawa Timur</option>
                </select>
            </div>
        </div>

        <div class="status-toggle" style="display: flex; justify-content: center; gap: 15px; margin-bottom: 30px;">
            <button class="toggle-btn active" id="tabMendatang" onclick="switchTab('Mendatang')">
                <i class="fa-regular fa-clock"></i> Mendatang
            </button>
            <button class="toggle-btn" id="tabSelesai" onclick="switchTab('Selesai')">
                <i class="fa-solid fa-history"></i> Selesai
            </button>
        </div>

        <div id="eventList"></div>
    </main>

    <div id="modalEvent" style="display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; backdrop-filter: blur(4px); overflow-y: auto; padding: 20px 0;">
        <div style="background:white; padding:30px; border-radius:24px; width:90%; max-width:550px; box-shadow: 0 20px 25px rgba(0,0,0,0.15); box-sizing: border-box; margin: auto;">
            <h2 style="margin-top:0; color:#1e293b; font-weight:800; font-size: 22px;">Buat Event Outdoor Baru ⛺</h2>
            <form id="formBuatEvent" style="display: flex; flex-direction: column; gap: 12px;">
                <div>
                    <label style="display:block; margin-bottom:4px; font-weight:600; font-size:14px;">Nama Event / Kegiatan</label>
                    <input type="text" id="eventTitle" placeholder="Contoh: Fun Camp Sikunir" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; box-sizing:border-box;" required>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label style="display:block; margin-bottom:4px; font-weight:600; font-size:14px;">Kategori</label>
                        <select id="eventCategory" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; box-sizing:border-box;">
                            <option value="Camp Bareng">Camp Bareng</option>
                            <option value="Hiking">Hiking</option>
                            <option value="Penanaman">Penanaman</option>
                            <option value="Aksi Sosial">Aksi Sosial</option>
                            <option value="Bersepeda">Bersepeda</option>
                        </select>
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:4px; font-weight:600; font-size:14px;">Tanggal Main</label>
                        <input type="date" id="eventDate" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; box-sizing:border-box;" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label style="display:block; margin-bottom:4px; font-weight:600; font-size:14px;">Wilayah Provinsi</label>
                        <select id="eventProvinsi" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; box-sizing:border-box;">
                            <option value="Jawa Tengah">Jawa Tengah</option>
                            <option value="Jawa Barat">Jawa Barat</option>
                            <option value="Jawa Timur">Jawa Timur</option>
                        </select>
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:4px; font-weight:600; font-size:14px;">Detail Alamat / Lokasi Camp</label>
                        <input type="text" id="eventLocation" placeholder="Contoh: Pantai Ketawang, Purworejo" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; box-sizing:border-box;" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label style="display:block; margin-bottom:4px; font-weight:600; font-size:14px;">Kapasitas (Kuota)</label>
                        <input type="text" id="eventQuota" placeholder="Contoh: 24 Peserta" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; box-sizing:border-box;" required>
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:4px; font-weight:600; font-size:14px;">Harga Tiket (HTM)</label>
                        <input type="text" id="eventPrice" placeholder="Contoh: Rp 25.000" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; box-sizing:border-box;" required>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label style="display:block; margin-bottom:4px; font-weight:600; font-size:14px;">Jam Main / Jam Kumpul</label>
                        <input type="text" id="eventTime" placeholder="Contoh: 16:00 WIB atau Jam 4 Sore" style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; box-sizing:border-box;" required>
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:4px; font-weight:600; font-size:14px;">URL Link Foto Cover</label>
                        <input type="url" id="eventPhoto" placeholder="Masukkan link gambar bebas..." style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; box-sizing:border-box;">
                    </div>
                </div>

                <div>
                    <label style="display:block; margin-bottom:4px; font-weight:600; font-size:14px;">Deskripsi Lengkap Kegiatan</label>
                    <textarea id="eventDescription" rows="4" placeholder="Tulis rincian acara, perlengkapan bawaan, ketetapan HTM, dll..." style="width:100%; padding:10px; border:1px solid #e2e8f0; border-radius:8px; box-sizing:border-box; font-family:inherit; resize:vertical;" required></textarea>
                </div>

                <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:10px;">
                    <button type="button" onclick="tutupModalEvent()" style="padding:10px 20px; border-radius:8px; border:none; background:#f1f5f9; font-weight:600; cursor:pointer;">Batal</button>
                    <button type="submit" style="padding:10px 20px; border-radius:8px; border:none; background:#ed8805; color:white; font-weight:600; cursor:pointer;">Publish Event</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://thksrgevzinamnbhdrqz.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoa3NyZ2V2emluYW1uYmhkcnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NDg5MjYsImV4cCI6MjA5NDIyNDkyNn0.VnAlU6B-ZXMta1cbB9scN2eBQbCkabg_98mJCw5j9ek'; 
        const { createClient } = supabase;
        const _supabase = createClient(supabaseUrl, supabaseKey);

        let semuaDataEvent = [];
        let tabAktif = 'Mendatang';

        async function ambilSistemEvent() {
            const container = document.getElementById('eventList');
            container.innerHTML = `<p style="text-align:center; color:#94a3b8; padding:40px 0;"><i class="fa-solid fa-spinner fa-spin"></i> Sinkronisasi Event...</p>`;
            
            try {
                const { data, error } = await _supabase
                    .from('Events') 
                    .select('*')
                    .order('event_date', { ascending: true });

                if (error) throw error;
                semuaDataEvent = data || [];
                renderSistemEvent();
            } catch (err) {
                console.warn("Gagal fetch Supabase:", err.message);
                semuaDataEvent = [];
                renderSistemEvent();
            }
        }

        function renderSistemEvent(dataDisaring = null) {
            const container = document.getElementById('eventList');
            const targetData = dataDisaring || semuaDataEvent;
            const hariIni = new Date().toLocaleDateString('en-CA'); 
            
            const eventTersaring = targetData.filter(ev => {
                const cocokTab = tabAktif === 'Mendatang' ? (ev.event_date >= hariIni) : (ev.event_date < hariIni);
                return cocokTab;
            });

            if (eventTersaring.length === 0) {
                if (tabAktif === 'Mendatang') {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon-clock"><i class="fa-regular fa-clock"></i></div>
                            <h2>Belum ada event mendatang.</h2>
                            <p>Jadilah yang pertama membuat event!</p>
                            <button onclick="bukaModalEvent()" style="background:#ed8805; color:white; border:none; padding:12px 25px; border-radius:30px; font-weight:800; margin-top:15px; cursor:pointer; box-shadow:0 4px 10px rgba(237,136,5,0.2);"><i class="fa-solid fa-plus"></i> Buat Event Sekarang</button>
                        </div>`;
                } else {
                    container.innerHTML = `
                        <div style="text-align:center; color:#94a3b8; padding:80px 0;">
                            <i class="fa-solid fa-box-open" style="font-size:40px; margin-bottom:15px;"></i>
                            <p>Belum ada rekaman sejarah event yang diselesaikan.</p>
                        </div>`;
                }
                return;
            }

            let htmlGrid = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px; margin-bottom:20px;">
                    <h3 style="color:#1e293b; font-weight:800; margin:0;">Daftar Kegiatan (${eventTersaring.length})</h3>
                    ${tabAktif === 'Mendatang' ? '<button onclick="bukaModalEvent()" style="background:#ed8805; color:white; border:none; padding:8px 16px; border-radius:8px; font-weight:700; cursor:pointer; font-size:13px; box-shadow:0 4px 10px rgba(237,136,5,0.15);"><i class="fa-solid fa-plus"></i> Tambah Event</button>' : ''}
                </div>
                <div class="event-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
            `;

            eventTersaring.forEach(ev => {
                const tglFormat = new Date(ev.event_date).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                const imgCover = ev.photo_url || 'https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?w=500';
                
                let badgeStyle = "background:#fef3c7; color:#d97706;"; 
                if (ev.category === 'Aksi Sosial') badgeStyle = "background:#fee2e2; color:#991b1b;"; 
                if (ev.category === 'Hiking') badgeStyle = "background:#e0f2fe; color:#0369a1;"; 
                if (ev.category === 'Penanaman') badgeStyle = "background:#dcfce7; color:#166534;"; 
                if (ev.category === 'Bersepeda') badgeStyle = "background:#fae8ff; color:#a21caf;"; 

                htmlGrid += `
                    <div class="event-card" style="background: white; border: 1px solid #f1f5f9; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.02); display:flex; flex-direction:column; justify-content:space-between;">
                        <div>
                            <img src="${imgCover}" style="width: 100%; height: 180px; object-fit: cover;">
                            <div style="padding: 20px;">
                                <span style="${badgeStyle} padding: 4px 10px; border-radius: 50px; font-size: 11px; font-weight: 700; text-transform: uppercase;">${ev.category || 'Outdoor'}</span>
                                <h4 style="margin: 10px 0 5px 0; font-size: 18px; color: #1e293b; font-weight: 800;">${ev.title}</h4>
                                <p style="color: #64748b; font-size: 13px; margin: 0 0 15px 0;"><i class="fa-solid fa-location-dot" style="color: #ef4444;"></i> ${ev.location}</p>
                            </div>
                        </div>
                        <div style="padding: 0 20px 20px 20px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f1f5f9; padding-top: 15px;">
                                <span style="font-size: 13px; color: #94a3b8; font-weight: 600;"><i class="fa-regular fa-calendar"></i> ${tglFormat}</span>
                                <a href="detail-event.html?id=${ev.id}" style="color: #ed8805; text-decoration: none; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 4px;">
                                    Ikut <i class="fa-solid fa-arrow-right"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });

            htmlGrid += `</div>`;
            container.innerHTML = htmlGrid;
        }

        function filterSistemEvent() {
            const kataKunci = document.getElementById('inputCari').value.toLowerCase();
            const filterProv = document.getElementById('selectFilterProvinsi').value;

            const hasilSaring = semuaDataEvent.filter(ev => {
                const cocokNama = ev.title.toLowerCase().includes(kataKunci) || ev.location.toLowerCase().includes(kataKunci);
                const cocokProv = filterProv === 'Semua' || ev.provinsi === filterProv;
                return cocokNama && cocokProv;
            });

            renderSistemEvent(hasilSaring);
        }

        function switchTab(pilihanTab) {
            tabAktif = pilihanTab;
            document.getElementById('tabMendatang').classList.toggle('active', pilihanTab === 'Mendatang');
            document.getElementById('tabSelesai').classList.toggle('active', pilihanTab === 'Selesai');
            renderSistemEvent(); 
        }

        document.getElementById('formBuatEvent').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const judul = document.getElementById('eventTitle').value;
            const kategori = document.getElementById('eventCategory').value;
            const prov = document.getElementById('eventProvinsi').value;
            const tgl = document.getElementById('eventDate').value;
            const lokasi = document.getElementById('eventLocation').value;
            const kuota = document.getElementById('eventQuota').value;
            const harga = document.getElementById('eventPrice').value;
            const jam = document.getElementById('eventTime').value;
            const foto = document.getElementById('eventPhoto').value;
            const deskripsi = document.getElementById('eventDescription').value;

            try {
                const { error } = await _supabase
                    .from('Events')
                    .insert([{
                        title: judul, category: kategori, provinsi: prov,
                        event_date: tgl, location: lokasi, quota: kuota,
                        price: harga, event_time: jam, photo_url: foto, description: deskripsi
                    }]);

                if (error) throw error;
                
                alert("Selamat! Event komunitasmu berhasil dipublikasikan.");
                tutupModalEvent();
                document.getElementById('formBuatEvent').reset();
                ambilSistemEvent(); 
            } catch (err) {
                alert("Gagal memposting event: " + err.message);
            }
        });

        function bukaModalEvent() { document.getElementById('modalEvent').style.display = 'flex'; }
        function tutupModalEvent() { document.getElementById('modalEvent').style.display = 'none'; }

        window.onload = ambilSistemEvent;
    </script>
</body>
</html>
