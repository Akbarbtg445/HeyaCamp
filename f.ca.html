</head>

    <div class="container">
        <!-- Tombol Kembali -->
        <button class="btn-back" onclick="window.history.back()">
            <i class="fa-solid fa-arrow-left"></i> Kembali
        </button>

        <div class="form-card">
            <h2 class="form-title">Tambah Camp Area</h2>

            <form id="formAddCamp">
                
                <!-- 3 Kolom Link Foto -->
                <div class="form-group">
                    <label class="form-label"><i class="fa-regular fa-image" style="color:#ea580c;"></i> Foto Camp Area (Gunakan Link)</label>
                    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
                        <input type="url" id="photo1" class="form-control" placeholder="1. Link Foto Cover (Wajib Diisi)" required>
                        <input type="url" id="photo2" class="form-control" placeholder="2. Link Foto Tambahan (Opsional)">
                        <input type="url" id="photo3" class="form-control" placeholder="3. Link Foto Tambahan (Opsional)">
                    </div>
                    <span style="color: #ef4444; font-size: 13px; margin-top: 8px; display: block;">* Minimal isi 1 link foto untuk cover. Gunakan link dari Google Drive, ImgBB, atau Pinterest.</span>
                </div>

                <!-- Nama Area -->
                <div class="form-group">
                    <label class="form-label">Nama Area</label>
                    <input type="text" id="campName" class="form-control" placeholder="Contoh: Sikembang" required>
                </div>

                <!-- Deskripsi -->
                <div class="form-group">
                    <label class="form-label">Deskripsi</label>
                    <textarea id="campDesc" class="form-control" rows="5" placeholder="Ceritakan tentang suasana, pemandangan, dan hal menarik lainnya..." required></textarea>
                </div>

                <!-- Lokasi & Harga -->
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label"><i class="fa-solid fa-location-dot" style="color:#ea580c;"></i> Lokasi</label>
                        <input type="text" id="campLocation" class="form-control" placeholder="Nama Kota/Kabupaten" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label"><i class="fa-solid fa-dollar-sign" style="color:#22c55e;"></i> Harga per Malam</label>
                        <input type="number" id="campPrice" class="form-control" placeholder="Contoh: 50000" required>
                    </div>
                </div>

                <!-- Region -->
                <div class="form-group">
                    <label class="form-label">Region/Daerah (Opsional)</label>
                    <select id="campRegion" class="form-control" style="cursor: pointer; appearance: none;">
                        <option value="" disabled selected>Pilih Daerah</option>
                        <option value="Jawa Barat">Jawa Barat</option>
                        <option value="Jawa Tengah">Jawa Tengah</option>
                        <option value="Jawa Timur">Jawa Timur</option>
                        <option value="Luar Pulau">Luar Pulau Jawa</option>
                    </select>
                </div>

                <!-- Fasilitas Tersedia -->
                <div class="form-group">
                    <label class="form-label">Fasilitas Tersedia</label>
                    <div class="facilities-container">
                        <label><input type="checkbox" class="facility-checkbox" value="Wifi"><span class="facility-label"><i class="fa-solid fa-wifi"></i> Wifi</span></label>
                        <label><input type="checkbox" class="facility-checkbox" value="Parkir"><span class="facility-label"><i class="fa-solid fa-car"></i> Parkir</span></label>
                        <label><input type="checkbox" class="facility-checkbox" value="Kantin"><span class="facility-label"><i class="fa-solid fa-mug-hot"></i> Kantin</span></label>
                        <label><input type="checkbox" class="facility-checkbox" value="Sewa Tenda"><span class="facility-label"><i class="fa-solid fa-tent"></i> Sewa Tenda</span></label>
                        <label><input type="checkbox" class="facility-checkbox" value="Pusat Info"><span class="facility-label"><i class="fa-solid fa-circle-info"></i> Pusat Info</span></label>
                    </div>
                </div>

                <!-- Tombol Bawah -->
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="window.history.back()">Batal</button>
                    <button type="submit" class="btn-save">Simpan Camp Area</button>
                </div>

            </form>
        </div>
    </div>

    <script>
        // 1. Konfigurasi Supabase
        const supabaseUrl = 'https://thksrgevzinamnbhdrqz.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoa3NyZ2V2emluYW1uYmhkcnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NDg5MjYsImV4cCI6MjA5NDIyNDkyNn0.VnAlU6B-ZXMta1cbB9scN2eBQbCkabg_98mJCw5j9ek'; 
        const { createClient } = supabase;
        const _supabase = createClient(supabaseUrl, supabaseKey);

        // 2. Fungsi Kirim Data
        document.getElementById('formAddCamp').addEventListener('submit', async function(e) {
            e.preventDefault(); // Mencegah reload halaman
            
            let btn = document.querySelector('.btn-save');
            btn.innerText = "Menyimpan ke Database...";
            btn.disabled = true; 
            
            // Ambil semua data dari inputan
            const photo1 = document.getElementById('photo1').value;
            const photo2 = document.getElementById('photo2').value;
            const photo3 = document.getElementById('photo3').value;
            const name = document.getElementById('campName').value;
            const desc = document.getElementById('campDesc').value;
            const location = document.getElementById('campLocation').value;
            const price = document.getElementById('campPrice').value;
            const region = document.getElementById('campRegion').value;
            
            // Mengambil semua fasilitas yang dicentang dan menggabungkannya
            const selectedFacilities = [];
            document.querySelectorAll('.facility-checkbox:checked').forEach(checkbox => {
                selectedFacilities.push(checkbox.value);
            });
            const facilitiesText = selectedFacilities.join(', '); // Contoh hasil: "Wifi, Parkir, Kantin"

            // Mengirim data ke tabel 'CampArea' di Supabase
            const { error } = await _supabase.from('CampArea').insert([
                {
                    name: name,
                    description: desc,
                    location: location,
                    price: parseInt(price), // Ubah ke format angka
                    region: region,
                    facilities: facilitiesText,
                    photo1: photo1,
                    photo2: photo2,
                    photo3: photo3
                }
            ]);

            // Mengecek apakah berhasil atau gagal
            if (error) {
                alert("Gagal menyimpan data: " + error.message);
                btn.innerText = "Simpan Camp Area";
                btn.disabled = false;
            } else {
                alert("Berhasil! Camp Area sudah masuk ke Database Supabase.");
                window.location.href = "ca.html"; // Kembali ke halaman utama
            }
        });
    </script>
</body>
</html>
