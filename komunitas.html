            <li><a href="lokasi.html"><i class="fa-solid fa-map-location-dot"></i>Lokasi</a></li>

    <section class="community-header">
        <div class="header-content">
            <div class="tag-regional">
                <i class="fa-solid fa-earth-asia"></i> Komunitas Regional
            </div>
            <div class="title-group">
                <h1>Gabung <span class="highlight">Komunitas</span></h1>
                <p>Temukan dan bergabung dengan komunitas camper di daerahmu</p>
            </div>
        </div>
        <div class="header-action">
            <a href="form.komunitas.html" class="btn-create">
                <i class="fa-solid fa-plus"></i> Buat Komunitas
            </a>
        </div>
    </section> 

    <!-- Container untuk daftar komunitas -->
    <div id="listKomunitasBaru" class="community-grid">
        <p style="text-align: center; grid-column: 1/-1;">Memuat data komunitas...</p>
    </div>

<script>
    // 1. Konfigurasi Supabase
    const supabaseUrl = 'https://thksrgevzinamnbhdrqz.supabase.co'; 
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoa3NyZ2V2emluYW1uYmhkcnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NDg5MjYsImV4cCI6MjA5NDIyNDkyNn0.VnAlU6B-ZXMta1cbB9scN2eBQbCkabg_98mJCw5j9ek'; 
     
    const { createClient } = supabase;
    const _supabase = createClient(supabaseUrl, supabaseKey);

    // 2. Fungsi Utama Ambil Data
    async function tampilkanKomunitas() {
        const container = document.getElementById('listKomunitasBaru');
        
        try {
            // Ambil data dari tabel 'Komunitas' (K besar)
            const { data: daftarKomunitas, error } = await _supabase
                .from('Komunitas')
                .select('*')
                .order('created_at', { ascending: false }); // Biar yang terbaru di atas

            if (error) throw error;

            if (daftarKomunitas && daftarKomunitas.length > 0) {
                container.innerHTML = daftarKomunitas.map(item => `
                    <a href="detail-komunitas.html?id=${item.id}" class="card-link">
                        <div class="community-card">
                            <div class="card-cover">
                                <img src="${item.cover || 'https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?w=500'}" alt="Cover">
                            </div>
                            <div class="card-body">
                                <div class="card-logo">
                                    <img src="${item.logo || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(item.nama)}" alt="Logo">
                                </div>
                                <h4 class="card-title">${item.nama}</h4>
                                <p class="card-stats"><i class="fa-solid fa-users"></i> ${item.anggota || 0} anggota</p>
                                <p class="card-desc">${item.deskripsi}</p>
                            </div>
                        </div>
                    </a>
                `).join('');
            } else {
                container.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>Belum ada komunitas yang terdaftar.</p>";
            }
        } catch (err) {
            console.error("Gagal ambil data:", err.message);
            container.innerHTML = `<p style='color: red; grid-column: 1/-1; text-align: center;'>Gagal memuat data: ${err.message}</p>`;
        }
    }

    // 3. Jalankan fungsi saat halaman siap
    document.addEventListener('DOMContentLoaded', tampilkanKomunitas);
</script>
</body>
</html>
