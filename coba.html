<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Custom</title>
    
    <!-- Import FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Memanggil file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <!-- 1. Bagian Logo -->
        <div class="nav-logo">
            <!-- Ganti src dengan link logo Anda -->
            <img src="https://via.placeholder.com/150x50?text=Logo+Yuru+Camp" alt="Logo">
        </div>

        <!-- 2. Bagian Menu Tengah -->
        <ul class="nav-links">
            <li><a href="#"><i class="fa-solid fa-house"></i> Beranda</a></li>
            <li><a href="#"><i class="fa-solid fa-mountain"></i> Aktivitas</a></li>
            <li><a href="#"><i class="fa-regular fa-user"></i> Komunitas</a></li>
            <li>
                <a href="#">
                    <i class="fa-solid fa-tent"></i> 
                    <span class="text-stack"><span>Camp</span><span>Area</span></span>
                </a>
            </li>
            <li><a href="#"><i class="fa-regular fa-calendar"></i> Acara</a></li>
            <li><a href="#"><i class="fa-regular fa-circle-play"></i> Nonton</a></li>
        </ul>

    </nav>
    <!-- BAGIAN HEADER YURUCAMP -->
<section class="header-yuru">
    <h1 class="logo-text">
        <span class="yuru">Yuru</span><span class="camp">Camp</span>
    </h1>
    <h2 class="subtitle">Indonesia</h2>
    <div class="tags">
        <span>#camping</span>
        <span>#alam</span>
        <span>#santai</span>
    </div>
</section>

<!-- BAGIAN GALERI GESER (CAROUSEL) -->
<section class="gallery-section">
    <div class="carousel-track">
        <!-- Kartu Gambar 1 -->
        <div class="gallery-card">
            <img src="https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?q=80&w=500" alt="Camp 1">
        </div>
        <!-- Kartu Gambar 2 -->
        <div class="gallery-card">
            <img src="https://images.unsplash.com/photo-1478131143081-80f7f84ca84d?q=80&w=500" alt="Camp 2">
        </div>
        <!-- Kartu Gambar 3 -->
        <div class="gallery-card">
            <img src="https://images.unsplash.com/photo-153756526675b-34ad68e811c6?q=80&w=500" alt="Camp 3">
        </div>
        <!-- Kartu Gambar 4 -->
        <div class="gallery-card">
            <img src="https://images.unsplash.com/photo-1517824806704-9040b037703b?q=80&w=500" alt="Camp 4">
        </div>
        <!-- Kartu Gambar 5 -->
        <div class="gallery-card">
            <img src="https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?q=80&w=500" alt="Camp 5">
        </div>
    </div>
</section>

</body>
</html>
