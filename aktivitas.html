<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="aktivitas.css"> 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">
            <img src="https://i.pinimg.com/736x/63/f7/b9/63f7b9e05066366fc3a65f4c3ae9eebd.jpg" alt="Logo">
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> Beranda</a></li>
            <li><a href="katalog.html"><i class="fa-solid fa-campground"></i> Sewa Alat</a></li>
            <li><a href="boking.html"><i class="fa-solid fa-mountain"></i> Alat Sewa</a></li>
            <li><a href="lokasi.html"><i class="fa-solid fa-map-location-dot"></i> Lokasi</a></li>
            <li><a href="komunitas.html"><i class="fa-regular fa-user"></i> Komunitas</a></li>
            <li>
                <a href="ca.html">
                    <i class="fa-solid fa-tent"></i> 
                    <span class="text-stack"><span>Camp</span><span>Area</span></span>
                </a>
            </li>
            <li><a href="ak.html"><i class="fa-regular fa-calendar"></i> Acara</a></li>
        </ul>
    </nav>

    <div class="mobile-nav">
        <a href="index.html" class="mobile-nav-item"><i class="fa-solid fa-house"></i><span>Beranda</span></a>
        <a href="katalog.html" class="mobile-nav-item"><i class="fa-solid fa-campground"></i><span>Sewa</span></a>
        <a href="komunitas.html" class="mobile-nav-item"><i class="fa-regular fa-user"></i><span>Komunitas</span></a>
        <a href="aktivitas.html" class="mobile-nav-item active"><i class="fa-regular fa-calendar"></i><span>Aktivitas</span></a>
        <a href="ca.html" class="mobile-nav-item"><i class="fa-solid fa-tent"></i><span>Area</span></a>
    </div>

    <main class="container">
        <div class="header-komunitas">
            <div>
                <h1>Aktivitas <span>Camping</span></h1>
                <p>Temukan dan bagikan momen petualanganmu</p>
            </div>
            <a href="f.aktivitas.html" class="btn-create">
                <i class="fa-solid fa-plus"></i> Buat Aktivitas
            </a>
        </div>

        <div class="search-wrapper">
            <div class="search-bar-container">
                <div class="search-input-group">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Cari cerita atau lokasi...">
                </div>

                <div class="vertical-divider"></div>

                <div class="filter-group">
                    <i class="fa-solid fa-tag"></i>
                    <select id="filterCategory">
                        <option value="">Semua Kategori</option>
                        <option>Camping</option>
                        <option>Hiking</option>
                        <option>Glamping</option>
                        <option>Touring</option>
                    </select>
                    <i class="fa-solid fa-chevron-down chevron"></i>
                </div>

                <div class="vertical-divider"></div>

                <div class="filter-group">
                    <i class="fa-solid fa-filter"></i>
                    <select id="filterRegion">
                        <option value="">Semua Region</option>
                    </select>
                    <i class="fa-solid fa-chevron-down chevron"></i>
                </div>
            </div>
        </div>

        <div id="activityGrid" class="activity-grid">
            <p style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 50px;">Memuat aktivitas terbaru...</p>
        </div>
    </main>

    <script>
    const supabaseUrl = 'https://thksrgevzinamnbhdrqz.supabase.co'; 
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoa3NyZ2V2emluYW1uYmhkcnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NDg5MjYsImV4cCI6MjA5NDIyNDkyNn0.VnAlU6B-ZXMta1cbB9scN2eBQbCkabg_98mJCw5j9ek'; 
    const { createClient } = supabase;
    const _supabase = createClient(supabaseUrl, supabaseKey);

    async function fetchActivities() {
        const grid = document.getElementById('activityGrid');
        try {
            const { data: activities, error } = await _supabase
                .from('Aktivitas')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            if (activities && activities.length > 0) {
                let html = '';
                activities.forEach(act => {
                    const formattedDate = new Date(act.activity_date).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                    html += `
                    <a href="detail-postingan.html?id=${act.id}" class="activity-card-link" data-category="${act.category}" style="text-decoration: none; color: inherit;">
                        <div class="activity-card">
                            <div class="card-img-wrapper">
                                <img src="${act.photo_url || 'https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?w=800'}" alt="${act.title}">
                                <div class="card-tags">
                                    <span class="tag-community">${act.community_name}</span>
                                    <span class="tag-location"><i class="fa-solid fa-location-dot"></i> ${act.location}</span>
                                </div>
                            </div>
                            <div class="card-content">
                                <h3 class="card-title">${act.title}</h3>
                                <div class="card-date"><i class="fa-regular fa-calendar"></i> ${formattedDate}</div>
                            </div>
                        </div>
                    </a>`;
                });
                grid.innerHTML = html;
            } else {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8; padding: 50px;">Belum ada aktivitas.</p>';
            }
        } catch (err) {
            grid.innerHTML = `<p style="text-align: center; color: red;">Gagal memuat data.</p>`;
        }
    }

    async function fetchRegions() {
        const filterRegion = document.getElementById('filterRegion');
        try {
            const { data, error } = await _supabase.from('Komunitas').select('nama');
            if (error) throw error;
            if (data) {
                let html = '<option value="">Semua Region</option>';
                data.forEach(item => { html += `<option value="${item.nama}">${item.nama}</option>`; });
                filterRegion.innerHTML = html;
            }
        } catch (err) { console.error(err); }
    }

    function setupFilters() {
        const searchInput = document.getElementById('searchInput');
        const filterCategory = document.getElementById('filterCategory');
        const filterRegion = document.getElementById('filterRegion');

        const runFilter = () => {
            const searchTerm = searchInput.value.toLowerCase();
            const categoryTerm = filterCategory.value;
            const regionTerm = filterRegion.value;
            const cards = document.querySelectorAll('.activity-card-link');
            
            cards.forEach(card => {
                const title = card.querySelector('.card-title').innerText.toLowerCase();
                const location = card.querySelector('.tag-location').innerText.toLowerCase();
                const category = card.getAttribute('data-category'); 
                const region = card.querySelector('.tag-community').innerText;

                const matchesSearch = title.includes(searchTerm) || location.includes(searchTerm);
                const matchesCategory = categoryTerm === "" || category === categoryTerm;
                const matchesRegion = regionTerm === "" || region === regionTerm;

                card.style.display = (matchesSearch && matchesCategory && matchesRegion) ? "block" : "none";
            });
        };

        searchInput.addEventListener('input', runFilter);
        filterCategory.addEventListener('change', runFilter);
        filterRegion.addEventListener('change', runFilter);
    }

    document.addEventListener('DOMContentLoaded', async () => {
        await fetchActivities();
        await fetchRegions();
        setupFilters();
    });
    </script>
</body>
</html>
