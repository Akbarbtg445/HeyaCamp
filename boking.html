</head>

        <ul class="nav-links">

            <li><a href="komunitas.html"><i class="fa-regular fa-user"></i> Komunitas</a></li>
            <li>
                <a href="ca.html">
                    <i class="fa-solid fa-tent"></i> 
                    <span class="text-stack"><span>Camp</span><span>Area</span></span>
                </a>
            </li>
            <li><a href="ak.html"><i class="fa-regular fa-calendar"></i> Acara</a></li>

    <div class="mobile-nav">
        <a href="index.html" class="mobile-nav-item"><i class="fa-solid fa-house"></i><span>Beranda</span></a>
        <a href="katalog.html" class="mobile-nav-item"><i class="fa-solid fa-campground"></i><span>Sewa</span></a>
        <a href="komunitas.html" class="mobile-nav-item"><i class="fa-regular fa-user"></i><span>Komunitas</span></a>
        <a href="aktivitas.html" class="mobile-nav-item"><i class="fa-regular fa-calendar"></i><span>Aktivitas</span></a>
        <a href="ca.html" class="mobile-nav-item"><i class="fa-solid fa-tent"></i><span>Area</span></a>
    </div>

    <main class="container">
        <div class="card">
            <h2><i class="fa-solid fa-clock-rotate-left"></i> Monitoring Sewa Real-time</h2>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Penyewa</th>
                            <th>Alat & Jumlah</th>
                            <th>Tanggal Sewa</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="bookingTable">
                        <tr><td colspan="4" style="text-align:center;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // 1. Konfigurasi Supabase
        const supabaseUrl = 'https://thksrgevzinamnbhdrqz.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoa3NyZ2V2emluYW1uYmhkcnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NDg5MjYsImV4cCI6MjA5NDIyNDkyNn0.VnAlU6B-ZXMta1cbB9scN2eBQbCkabg_98mJCw5j9ek'; 
        const { createClient } = supabase;
        const _supabase = createClient(supabaseUrl, supabaseKey);

        // 2. Fungsi Ambil Data Pesanan
        async function muatDataBooking() {
            const tbody = document.getElementById('bookingTable');
            
            try {
                const { data: Pesanan, error } = await _supabase
                    .from('Pesanan')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!Pesanan || Pesanan.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Belum ada pesanan masuk.</td></tr>';
                    return;
                }

                tbody.innerHTML = ''; 

                Pesanan.forEach(item => {
                    const items = item.item_disewa || [];
                    
                    const rincianAlat = items.map(alat => 
                        `${alat.nama} <strong>(x${alat.jumlah})</strong>`
                    ).join('<br>');

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <strong>${item.nama_penyewa}</strong>
                        </td>
                        <td>${rincianAlat}</td>
                        <td>${item.tanggal_sewa}</td>
                        <td>
                            <span class="status-badge ${item.status === 'Selesai' ? 'status-selesai' : 'status-konfirmasi'}">
                                ${item.status || 'Menunggu'}
                            </span>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                console.error("Detail Error:", err);
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">Gagal memuat data: ' + err.message + '</td></tr>';
            }
        }

        window.onload = muatDataBooking;
    </script>
</body>
</html>
