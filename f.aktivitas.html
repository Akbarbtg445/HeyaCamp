<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Aktivitas Baru - HeyaCamp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="f.aktivitas.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <a href="komunitas.html" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Kembali
        </a>

        <div class="form-card">
            <div class="form-header">
                <h2>Buat Aktivitas Baru</h2>
            </div>

            <form id="formAktivitas">
                <div class="form-label">Foto Aktivitas</div>
                <div class="photo-links-container">
                    <div class="link-row">
                        <span class="badge-cover">Cover</span>
                        <input type="url" id="photo1" class="form-control" placeholder="Paste link foto utama (Pinterest/ImgBB)" required>
                    </div>
                    <p style="color: #ef4444; font-size: 12px; margin-top: 5px;">* Minimal 1 foto (cover)</p>
                </div>

                <div class="form-group">
                    <label class="form-label">Judul Aktivitas</label>
                    <input type="text" id="title" class="form-control" placeholder="Contoh: Camping di Danau Toba" required>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Kategori</label>
                        <select id="category" class="form-control">
                            <option value="" disabled selected>Pilih kategori</option>
                            <option>Camping</option>
                            <option>Hiking</option>
                            <option>Glamping</option>
                            <option>Touring</option>
                            <option>Review</option>
                            <option>Tutorial</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tanggal</label>
                        <input type="date" id="date" class="form-control" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Pilih Komunitas (Region)</label>
                    <select id="communitySelect" class="form-control" required>
                        <option value="" disabled selected>Memuat komunitas...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Lokasi</label>
                    <input type="text" id="location" class="form-control" placeholder="Lokasi kegiatan" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Deskripsi</label>
                    <textarea id="description" class="form-control" rows="6" placeholder="Ceritakan pengalaman anda... (Support Markdown)"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">Posting ke Komunitas</button>
            </form>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://thksrgevzinamnbhdrqz.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoa3NyZ2V2emluYW1uYmhkcnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NDg5MjYsImV4cCI6MjA5NDIyNDkyNn0.VnAlU6B-ZXMta1cbB9scN2eBQbCkabg_98mJCw5j9ek'; 
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 1. Memuat daftar komunitas dari tabel 'Komunitas'
        async function fetchCommunities() {
            const select = document.getElementById('communitySelect');
            try {
                const { data, error } = await _supabase
                    .from('Komunitas') 
                    .select('nama');

                if (error) throw error;

                let html = '<option value="" disabled selected>Pilih Komunitas</option>';
                if (data && data.length > 0) {
                    data.forEach(item => {
                        html += `<option value="${item.nama}">${item.nama}</option>`;
                    });
                } else {
                    html = '<option value="" disabled>Belum ada komunitas</option>';
                }
                select.innerHTML = html;
            } catch (err) {
                console.error("Error:", err.message);
                select.innerHTML = '<option value="" disabled>Gagal memuat data</option>';
            }
        }

        // 2. Submit Data ke Tabel 'Aktivitas'
        document.getElementById('formAktivitas').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Memproses...";
            btn.disabled = true;

            const payload = {
                title: document.getElementById('title').value,
                community_name: document.getElementById('communitySelect').value,
                activity_date: document.getElementById('date').value,
                location: document.getElementById('location').value,
                category: document.getElementById('category').value,
                description: document.getElementById('description').value,
                photo_url: document.getElementById('photo1').value
            };

            const { error } = await _supabase.from('Aktivitas').insert([payload]);

            if (error) {
                alert("Gagal: " + error.message);
                btn.innerText = "Posting ke Komunitas";
                btn.disabled = false;
            } else {
                alert("Berhasil diposting!");
                window.location.href = 'komunitas.html';
            }
        });

        document.addEventListener('DOMContentLoaded', fetchCommunities);
    </script>
</body>
</html>
