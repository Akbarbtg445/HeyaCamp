<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Aktivitas Baru - HeyaCamp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="f. aktivitas.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
     <nav class="navbar">
        <div class="nav-logo">
            <img src="https://i.pinimg.com/736x/63/f7/b9/63f7b9e05066366fc3a65f4c3ae9eebd.jpg" alt="Logo">
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> Beranda</a></li>
            <li><a href="katalog.html"><i class="fa-solid fa-campground"></i> Sewa Alat</a></li>
            <li><a href="boking.html"><i class="fa-solid fa-mountain"></i> Alat Yang Sedang Disewa</a></li>
            <li><a href="lokasi.html"><i class="fa-solid fa-map-location-dot"></i> Lokasi</a></li>
            <li><a href="cara sewa.html"><i class="fa-solid fa-book-open"></i> Cara Sewa</a></li>
            <li><a href="komunitas.html"><i class="fa-regular fa-user"></i> Komunitas</a></li>
            <li>
                <a href="ca.html">
                    <i class="fa-solid fa-tent"></i> 
                    <span class="text-stack"><span>Camp</span><span>Area</span></span>
                </a>
            </li>
            <li><a href="ak.html"><i class="fa-regular fa-calendar"></i> Acara</a></li>
            <li><a href="#"><i class="fa-regular fa-circle-play"></i> Nonton</a></li>
        </ul>
    </nav>

    <div class="container">
        <a href="aktivitas.html" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Kembali
        </a>

        <div class="form-card">
            <div class="form-header">
                <h2>Buat Aktivitas Baru</h2>
                <p>Bagikan cerita petualanganmu dengan komunitas</p>
            </div>

            <form id="formAktivitas">
                <div class="form-label">Tautan Foto (Minimal 1 untuk Sampul)</div>
                <div class="photo-links-container">
                    <div class="link-row">
                        <span class="badge-cover">Sampul</span>
                        <input type="url" id="photo1" class="form-control" placeholder="Paste link foto utama" required>
                    </div>
                    <div class="link-row">
                        <div class="badge-empty"></div>
                        <input type="url" id="photo2" class="form-control" placeholder="Link foto tambahan 1 (Opsional)">
                    </div>
                    <div class="link-row">
                        <div class="badge-empty"></div>
                        <input type="url" id="photo3" class="form-control" placeholder="Link foto tambahan 2 (Opsional)">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Judul Aktivitas</label>
                    <input type="text" id="title" class="form-control" placeholder="Contoh: Camping Santai di Ranu Kumbolo" required>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Pilih Komunitas</label>
                        <select id="communitySelect" class="form-control" required>
                            <option value="" disabled selected>Memuat komunitas...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tanggal</label>
                        <input type="date" id="date" class="form-control" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Lokasi</label>
                        <input type="text" id="location" class="form-control" placeholder="Gunung / Kota / Tempat" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Kategori</label>
                        <select id="category" class="form-control">
                            <option>Camping</option>
                            <option>Hiking</option>
                            <option>Glamping</option>
                            <option>Touring</option>
                            <option>Other</option>
                            <option>Review</option>
                            <option>Tutorial</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Cerita Singkat</label>
                    <textarea id="description" class="form-control" rows="4" placeholder="Ceritakan sedikit tentang kegiatan ini..."></textarea>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">Posting ke Komunitas</button>
            </form>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://thksrgevzinamnbhdrqz.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoa3NyZ2V2emluYW1uYmhkcnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NDg5MjYsImV4cCI6MjA5NDIyNDkyNn0.VnAlU6B-ZXMta1cbB9scN2eBQbCkabg_98mJCw5j9ek'; 
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 1. Fungsi memuat daftar komunitas
        async function fetchCommunities() {
            const select = document.getElementById('communitySelect');
            try {
                const { data: communities, error } = await _supabase
                    .from('Aktivitas') 
                    .select('community_name')
                    .not('community_name', 'is', null);

                if (error) throw error;

                // Hilangkan duplikat
                const uniqueCommunities = [...new Set(communities.map(item => item.community_name))];

                let html = '<option value="" disabled selected>Pilih Komunitas</option>';
                if (uniqueCommunities.length > 0) {
                    uniqueCommunities.forEach(name => {
                        html += `<option value="${name}">${name}</option>`;
                    });
                } else {
                    html = '<option value="" disabled>Belum ada komunitas terdaftar</option>';
                }
                
                select.innerHTML = html;
            } catch (err) {
                console.error("Gagal memuat komunitas:", err);
                select.innerHTML = '<option value="" disabled>Gagal memuat data</option>';
            }
        }

        // 2. Event Listener Form Submit (Hanya SATU saja)
        document.getElementById('formAktivitas').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Memproses...";
            btn.disabled = true;

            const payload = {
                title: document.getElementById('title').value,
                community_name: document.getElementById('communitySelect').value, // Ambil dari select
                activity_date: document.getElementById('date').value,
                location: document.getElementById('location').value,
                category: document.getElementById('category').value,
                description: document.getElementById('description').value,
                photo_url: document.getElementById('photo1').value,
                photo_extra1: document.getElementById('photo2').value,
                photo_extra2: document.getElementById('photo3').value
            };

            const { error } = await _supabase.from('Aktivitas').insert([payload]);

            if (error) {
                alert("Gagal: " + error.message);
                btn.innerText = "Posting ke Komunitas";
                btn.disabled = false;
            } else {
                alert("Berhasil diposting!");
                window.location.href = 'komunitas.html';
            }
        });

        // Jalankan fetch saat halaman siap
        document.addEventListener('DOMContentLoaded', fetchCommunities);
    </script>
</body>
</html>
