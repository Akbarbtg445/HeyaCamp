<div class="search-container">

    <script>
     let allCamps = []; // Simpan semua data di sini

// 1. Konfigurasi Supabase
const supabaseUrl = 'https://thksrgevzinamnbhdrqz.supabase.co'; 
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoa3NyZ2V2emluYW1uYmhkcnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NDg5MjYsImV4cCI6MjA5NDIyNDkyNn0.VnAlU6B-ZXMta1cbB9scN2eBQbCkabg_98mJCw5j9ek'; 
const { createClient } = supabase;
const _supabase = createClient(supabaseUrl, supabaseKey);

const iconMap = {
    'Wifi': '<i class="fa-solid fa-wifi"></i>',
    'Parkir': '<i class="fa-solid fa-car"></i>',
    'Kantin': '<i class="fa-solid fa-mug-hot"></i>',
    'Sewa Tenda': '<i class="fa-solid fa-tent"></i>',
    'Pusat Info': '<i class="fa-solid fa-circle-info"></i>',
    'Toilet': '<i class="fa-solid fa-toilet-paper"></i>'
};

async function loadCampAreas() {
    try {
        const { data: camps, error } = await _supabase
            .from('CampArea')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) throw error;
        allCamps = camps; // Masukkan ke variabel global
        renderCamps(allCamps); // Tampilkan semua
    } catch (err) {
        console.error("Gagal memuat data:", err);
        document.getElementById('campGrid').innerHTML = '<p style="color: #ef4444; text-align: center;">Gagal memuat data.</p>';
    }
}

// Fungsi untuk memfilter data berdasarkan Search Input dan Dropdown Region
function filterCamps() {
    const searchText = document.getElementById('searchInput').value.toLowerCase();
    const regionValue = document.getElementById('regionFilter').value;

    const filtered = allCamps.filter(camp => {
        const matchSearch = camp.name.toLowerCase().includes(searchText);
        const matchRegion = (regionValue === "Semua") || (camp.region === regionValue);
        return matchSearch && matchRegion;
    });

    renderCamps(filtered);
}

// Fungsi untuk mencetak kartu ke HTML
function renderCamps(data) {
    const grid = document.getElementById('campGrid');
    if (data.length === 0) {
        grid.innerHTML = '<p style="color: #94a3b8; grid-column: 1 / -1; text-align: center; padding: 50px 0;">Tidak ada lokasi yang cocok.</p>';
        return;
    }

    let html = '';
    data.forEach(camp => {
        const priceFormatted = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(camp.price);
        
        let facilitiesHtml = '';
        if (camp.facilities) {
            const facArray = camp.facilities.split(', ');
            facArray.slice(0, 3).forEach(fac => {
                const iconStr = iconMap[fac] || '<i class="fa-solid fa-check"></i>';
                facilitiesHtml += `<div class="fac-icon" title="${fac}">${iconStr}</div>`;
            });
            if (facArray.length > 3) {
                facilitiesHtml += `<div class="fac-icon" style="color: #1e293b;">+${facArray.length - 3}</div>`;
            }
        }

        html += `
            <a href="detail-ca.html?id=${camp.id}" class="camp-card">
                <div class="card-img-wrapper">
                    <img src="${camp.photo1}" class="card-img" alt="Cover Camp">
                    <div class="price-tag">${priceFormatted}</div>
                    <div class="location-tag">
                        <i class="fa-solid fa-location-dot"></i>
                        <span>${camp.location}</span>
                    </div>
                    <div class="fac-container">${facilitiesHtml}</div>
                </div>
                <div class="card-content">
                    <h3 class="card-title">${camp.name}</h3>
                </div>
            </a>`;
    });
    grid.innerHTML = html;
}

window.onload = loadCampAreas;
    </script>
