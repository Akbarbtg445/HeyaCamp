    <div class="container">
        <h2 style="margin-top: 20px;">Pilih Alat Outdoor</h2>
        <div class="grid" id="katalogList"></div>

        <div class="card" style="margin-top: 30px; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <h3>Data Penyewa</h3>
            <input type="text" id="namaPenyewa" placeholder="Nama Lengkap" style="width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px;">
            <input type="tel" id="hpPenyewa" placeholder="Nomor WhatsApp" style="width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px;">
            <input type="date" id="tglSewa" style="width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px;">
            <textarea id="alamatPenyewa" placeholder="Alamat Lengkap" style="width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; height: 80px;"></textarea>
            <button id="btnSewa" class="btn" style="background: #1e5631; width: 100%; color: white; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;" onclick="prosesSewaSemua()">Sewa Sekarang</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://thksrgevzinamnbhdrqz.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoa3NyZ2V2emluYW1uYmhkcnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NDg5MjYsImV4cCI6MjA5NDIyNDkyNn0.VnAlU6B-ZXMta1cbB9scN2eBQbCkabg_98mJCw5j9ek'; 
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        const alatOutdoor = [
            { id: 1, nama: "Tenda Baseway Pavilo", harga: 35000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/Tenda%20Pavilo.png", desc: "Tenda Double layer, Kapasitas 4 orang, Frame Aloy" },
            { id: 2, nama: "Tenda WildShell JayaDipa", harga: 35000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/tenda%20wild%20shel.png", desc: "Tenda Double layer, Kapasitas 4 orang, Frame Aloy" },
            { id: 3, nama: "Tenda", harga: 20000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/tenda%20single%20layer.jpg", desc: "Tenda Single layer, Kapasitas 4 orang, Frame Alo" },
            { id: 4, nama: "Cerier Consina Terabi", harga: 20000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/terabi.jpg", desc: "Kapasitas 60Liter, Include Raincover" },
            { id: 5, nama: "Cerier Antarestar Ranger", harga: 20000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/Antarestar1.png", desc: "Kapasitas 65Liter, Include Raincover" },
            { id: 6, nama: "Cerier CO-TREX TENGGARONG", harga: 20000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/Syaratketentuan.png", desc: "Kapasitas 60Liter, include Raincover" },
            { id: 7, nama: "Irco Polar Series", harga: 10000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/sb.jpg", desc: "Ada yang include bantal ada yang tidak" },
            { id: 8, nama: "Matras Outdoor", harga: 5000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/matras.jpg", desc: "Warna Hitam / Warna Biru" },
            { id: 9, nama: "Trecking Pole Naturhike", harga: 5000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/treking%20pole.jpg", desc: "Panjang 100 cm/ Panjang 135cm Warna Biru" },
            { id: 10, nama: "Coking Set", harga: 10000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/cokingset%201jpg.jpg", desc: "Isi 2 Set Panci,Include Wadah" },
            { id: 11, nama: "Kompor Portable", harga: 10000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/kompor%20portable.jpg", desc: "Include Wadah" },
            { id: 12, nama: "Gas Kaleng", harga: 10000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/gas.jpg", desc: "Menyediakan Isi ulang Gas, Jika mau isi ulang gas kaleng bekas kaleng jgn dibuang" },
            { id: 13, nama: "Kursi Outdoor Speed", harga: 15000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/arival.jpg", desc: "Warna Coklat List Orange Ukuran XXL" },
            { id: 14, nama: "Kursi Outdoor Speed", harga: 15000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/coklat.jpg", desc: "Warna Coklat Ukuran XXL" },
            { id: 15, nama: "Meja Outdoor Speed", harga: 10000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/meja%20speed.jpg", desc: "Warna Coklat Ukuran XXL" },
        ];

        let cart = {};

        // RENDER KATALOG (Hanya dijalankan sekali saat page load)
        const katalogList = document.getElementById('katalogList');
        alatOutdoor.forEach(alat => {
            cart[alat.id] = 0;
            katalogList.innerHTML += `
                <div class="card" style="background: white; padding: 15px; border-radius: 12px; display: flex; flex-direction: column; justify-content: space-between;">
                    <div>
                        <img src="${alat.img}" alt="${alat.nama}" style="width:100%; height: 140px; object-fit: contain; border-radius: 8px;">
                        <h3 style="font-size: 1rem; margin: 10px 0 5px;">${alat.nama}</h3>
                        <p style="font-size: 0.8rem; color: #64748b; margin-bottom: 10px;">${alat.desc}</p>
                    </div>
                    <div>
                        <p style="font-weight: bold; color: #1e5631;">Rp ${alat.harga.toLocaleString()}/hari</p>
                        <div class="quantity-control">
                            <button class="btn-qty" onclick="updateQty(${alat.id}, -1)">-</button>
                            <span class="qty-value" id="qty-${alat.id}">0</span>
                            <button class="btn-qty" onclick="updateQty(${alat.id}, 1)">+</button>
                        </div>
                    </div>
                </div>`;
        });

        function updateQty(id, delta) {
            let newVal = cart[id] + delta;
            if (newVal >= 0) {
                cart[id] = newVal;
                document.getElementById(`qty-${id}`).innerText = newVal;
            }
        }

        async function prosesSewaSemua() {
            const nama = document.getElementById('namaPenyewa').value;
            const hp = document.getElementById('hpPenyewa').value;
            const tgl = document.getElementById('tglSewa').value;
            const alamat = document.getElementById('alamatPenyewa').value;

            let itemTerpilih = [];
            let totalHarga = 0;

            alatOutdoor.forEach(alat => {
                let qty = cart[alat.id];
                if (qty > 0) {
                    itemTerpilih.push({ nama: alat.nama, jumlah: qty, subtotal: alat.harga * qty });
                    totalHarga += (alat.harga * qty);
                }
            });

            if (!nama || !hp || !tgl || itemTerpilih.length === 0) {
                alert("Lengkapi data dan pilih minimal 1 alat!");
                return;
            }

            try {
                const { error } = await _supabase.from('Pesanan').insert([{
                    nama_penyewa: nama, nomor_hp: hp, tanggal_sewa: tgl,
                    alamat: alamat, item_disewa: itemTerpilih, total_harga: totalHarga
                }]);
                if (error) throw error;
                alert("Pesanan berhasil dikirim!");
                window.open(`https://wa.me/628123456789?text=${encodeURIComponent("Halo, saya " + nama + " ingin menyewa alat...")}`);
            } catch (err) {
                alert("Error: " + err.message);
            }
        }
    </script>
</body>
</html>
