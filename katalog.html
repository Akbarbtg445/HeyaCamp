<!DOCTYPE html>
<html>
<head>
    <title>Katalog Alat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="coba.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            background: #f1f5f9;
            padding: 5px 10px;
            border-radius: 8px;
            width: fit-content;
        }
        .btn-qty {
            background: #1e5631;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .qty-value {
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }
        /* Gaya tambahan untuk deskripsi agar rapi */
        .card-desc {
            font-size: 0.85rem;
            color: #64748b;
            margin: 5px 0 10px 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo">
            <img src="https://i.pinimg.com/736x/63/f7/b9/63f7b9e05066366fc3a65f4c3ae9eebd.jpg" alt="Logo">
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> Beranda</a></li>
            <li><a href="katalog.html"><i class="fa-solid fa-campground"></i>Sewa Alat</a></li>
            <li><a href="boking.html"><i class="fa-solid fa-mountain"></i> Alat Yang Sedang Disewa</a></li>
            <li><a href="lokasi.html"><i class="fa-solid fa-map-location-dot"></i>Lokasi</a></li>
            <li><a href="cara sewa.html"><i class="fa-solid fa-book-open"></i>Cara Sewa</a></li>
            <li><a href="komunitas.html"><i class="fa-regular fa-user"></i> Komunitas</a></li>
            <li>
                <a href="#">
                    <i class="fa-solid fa-tent"></i> 
                    <span class="text-stack"><span>Camp</span><span>Area</span></span>
                </a>
            </li>
            <li><a href="#"><i class="fa-regular fa-calendar"></i> Acara</a></li>
            <li><a href="#"><i class="fa-regular fa-circle-play"></i> Nonton</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2>Pilih Alat Outdoor</h2>
        <div class="grid" id="katalogList"></div>

        <div class="card" style="margin-top: 30px;">
            <h3>Data Penyewa</h3>
            
            <div style="margin-bottom: 15px;">
                <label>Nama Lengkap</label>
                <input type="text" id="namaPenyewa" placeholder="Masukkan nama Anda..." style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px;">
            </div>
            
            <div style="margin-bottom: 15px;">
                <label>Nomor HP (WhatsApp)</label>
                <input type="tel" id="hpPenyewa" placeholder="Contoh: 08123456789" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label>Tanggal Sewa</label>
                <input type="date" id="tglSewa" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label>Alamat</label>
                <textarea id="alamatPenyewa" placeholder="Masukkan alamat lengkap..." style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 5px; height: 80px;"></textarea>
            </div>
            
            <button id="btnSewa" class="btn" style="background: #1e5631; font-size: 1.1rem;" onclick="prosesSewaSemua()">Sewa Sekarang (Semua Item)</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://thksrgevzinamnbhdrqz.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoa3NyZ2V2emluYW1uYmhkcnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NDg5MjYsImV4cCI6MjA5NDIyNDkyNn0.VnAlU6B-ZXMta1cbB9scN2eBQbCkabg_98mJCw5j9ek'; 
        
        const { createClient } = supabase;
        const _supabase = createClient(supabaseUrl, supabaseKey);

        // Menambahkan properti 'desc' pada data alat
        const alatOutdoor = [
            { id: 1, nama: "Tenda Baseway Pavilo", harga: 35000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/Tenda%20Pavilo.png", desc: "Tenda Double layer, Kapasitas 4 orang, Frame Aloy" },
            { id: 2, nama: "Tenda WildShell JayaDipa", harga: 35000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/tenda%20wild%20shel.png", desc: "Tenda Double layer, Kapasitas 4 orang, Frame Aloy" },
            { id: 3, nama: "Tenda", harga: 20000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/tenda%20single%20layer.jpg", desc: "Tenda Single layer, Kapasitas 4 orang, Frame Alo" },
            { id: 4, nama: "Cerier Consina Terabi", harga: 20000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/terabi.jpg", desc: "Kapasitas 60Liter, Include Raincover" },
            { id: 5, nama: "Cerier Antarestar Ranger", harga: 20000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/Antarestar1.png", desc: "Kapasitas 65Liter, Include Raincover" },
            { id: 6, nama: "Cerier CO-TREX TENGGARONG", harga: 20000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/Syaratketentuan.png", desc: "Kapasitas 60Liter, include Raincover" },
            { id: 7, nama: "Irco Polar Series", harga: 10000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/sb.jpg", desc: "Ada yang include bantal ada yang tidak" },
            { id: 8, nama: "Matras Outdoor", harga: 5000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/matras.jpg", desc: "Warna Hitam / Warna Biru" },
            { id: 9, nama: "Trecking Pole Naturhike", harga: 5000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/treking%20pole.jpg", desc: "Panjang 100 cm/ Panjang 135cm Warna Biru" },
            { id: 10, nama: "Coking Set", harga: 10000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/cokingset%201jpg.jpg", desc: "Isi 2 Set Panci,Include Wadah" },
            { id: 11, nama: "Kompor Portable", harga: 10000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/kompor%20portable.jpg", desc: "Include Wadah" },
            { id: 12, nama: "Gas Kaleng", harga: 10000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/gas.jpg", desc: "Menyediakan Isi ulang Gas, Jika mau isi ulang gas kaleng bekas kaleng jgn dibuang" },
            { id: 13, nama: "Kursi Outdoor Speed", harga: 15000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/arival.jpg", desc: "Warna Coklat List Orange Ukuran XXL" },
            { id: 14, nama: "Kursi Outdoor Speed", harga: 15000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/coklat.jpg", desc: "Warna Coklat Ukuran XXL" },
            { id: 15, nama: "Meja Outdoor Speed", harga: 10000, img: "https://akbarbtg445.github.io/Alat-yang-disewakan/meja%20speed.jpg", desc: "Warna Coklat Ukuran XXL" },
        ];

        let cart = {};

        const katalogList = document.getElementById('katalogList');
        alatOutdoor.forEach(alat => {
            cart[alat.id] = 0;
            katalogList.innerHTML += `
                <div class="card">
                    <img src="${alat.img}" alt="${alat.nama}" style="width:100%; border-radius: 8px;">
                    <h3 style="margin-bottom: 0;">${alat.nama}</h3>
                    <p class="card-desc">${alat.desc}</p> <!-- Deskripsi alat -->
                    <p style="font-weight: bold; color: #1e5631;">Rp ${alat.harga.toLocaleString()}/hari</p>
                    <div class="quantity-control">
                        <button class="btn-qty" onclick="updateQty(${alat.id}, -1)">-</button>
                        <span class="qty-value" id="qty-${alat.id}">0</span>
                        <button class="btn-qty" onclick="updateQty(${alat.id}, 1)">+</button>
                    </div>
                </div>
            `;
        });

        function updateQty(id, delta) {
            let newVal = cart[id] + delta;
            if (newVal >= 0) {
                cart[id] = newVal;
                document.getElementById(`qty-${id}`).innerText = newVal;
            }
        }

        async function prosesSewaSemua() {
            const nama = document.getElementById('namaPenyewa').value;
            const hp = document.getElementById('hpPenyewa').value;
            const tgl = document.getElementById('tglSewa').value;
            const alamat = document.getElementById('alamatPenyewa').value;
            const btnSewa = document.getElementById('btnSewa');

            let itemTerpilih = [];
            let totalHarga = 0;

            alatOutdoor.forEach(alat => {
                let qty = cart[alat.id];
                if (qty > 0) {
                    itemTerpilih.push({
                        nama: alat.nama,
                        harga: alat.harga,
                        jumlah: qty,
                        subtotal: alat.harga * qty
                    });
                    totalHarga += (alat.harga * qty);
                }
            });

            if (!nama || !hp || !tgl || itemTerpilih.length === 0) {
                alert("Harap lengkapi data diri dan tambah minimal 1 alat!");
                return;
            }

            btnSewa.innerText = "Mengirim Pesanan...";
            btnSewa.disabled = true;

            try {
                const { error } = await _supabase
                    .from('pesanan')
                    .insert([
                        {
                            nama_penyewa: nama,
                            nomor_hp: hp,
                            tanggal_sewa: tgl,
                            alamat: alamat,
                            item_disewa: itemTerpilih,
                            total_harga: totalHarga,
                            status: 'Menunggu Konfirmasi'
                        }
                    ]);

                if (error) throw error;

                alert(`Pemesanan Berhasil!\nTotal: Rp ${totalHarga.toLocaleString()}`);
                
                const rincianWA = itemTerpilih.map(i => `- ${i.nama} (x${i.jumlah})`).join('\n');
                const pesanWA = `Halo Admin HeyaCamp, saya ${nama} ingin menyewa:\n${rincianWA}\n\nTanggal: ${tgl}\nTotal: Rp ${totalHarga.toLocaleString()}`;
                window.open(`https://wa.me/628123456789?text=${encodeURIComponent(pesanWA)}`, '_blank');

            } catch (err) {
                alert("Gagal memproses pesanan: " + err.message);
            } finally {
                btnSewa.innerText = "Sewa Sekarang (Semua Item)";
                btnSewa.disabled = false;
            }
        }
    </script>
</body>
</html>
